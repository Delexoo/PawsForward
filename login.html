<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Paws Forward">
  <meta name="theme-color" content="#ffffff">
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="Employee portal — enter the PIN to unlock the Paws Forward dashboard.">
  <link rel="canonical" href="https://joinpawsforward.com/login.html">
  <title>Employee portal · Paws Forward</title>
  <link rel="icon" href="icons/favicon.png?v=20261107f" type="image/png" sizes="64x64">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=20261107f" sizes="180x180">
  <link rel="manifest" href="manifest.webmanifest?v=20261107f">
  <link rel="stylesheet" href="css/fonts.css?v=20261107f">
  <script src="js/theme.js?v=20261107f"></script>
  <link rel="stylesheet" href="css/site.css?v=20261107f">
  <link rel="stylesheet" href="css/paws.css?v=20261107f">
  <script src="js/config.js?v=20261107f"></script>
  <script src="js/canonical.js?v=20261107f"></script>
</head>
<body data-page="login">
  <div id="site-lock" role="dialog" aria-modal="true" aria-labelledby="pin-hint">
    <div class="site-lock-inner">
      <img class="site-lock-logo" src="doc/brand-mark.png" width="72" height="72" alt="PawsForward" />
      <p class="site-lock-hint" id="pin-hint">Employee portal — enter your PIN</p>
      <p id="status-banner" class="site-lock-error" hidden role="status"></p>
      <form id="pin-form" class="site-lock-form" autocomplete="off" novalidate>
        <label class="sr-only" for="pin-input">Your PIN</label>
        <input
          id="pin-input"
          class="site-lock-input"
          name="pin"
          type="password"
          inputmode="numeric"
          pattern="[0-9]*"
          maxlength="4"
          minlength="4"
          required
          autofocus
          placeholder="Your PIN"
          autocomplete="one-time-code"
          aria-describedby="pin-hint"
        />
      </form>
    </div>
  </div>

  <script src="js/vendor/supabase.js?v=20261107f"></script>
  <script src="js/supabase-client.js?v=20261107f"></script>
  <script src="js/pin-lock.js?v=20261107f"></script>
  <script src="js/login.js?v=20261107f"></script>
</body>
</html>
