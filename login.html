<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="Enter the PawsForward operator PIN to unlock the dashboard.">
  <link rel="canonical" href="https://delexoo.github.io/PawsForward/login.html">
  <title>Unlock · PawsForward</title>
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="doc/brand-mark.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/fonts.css">
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/site.css">
  <link rel="stylesheet" href="css/paws.css">
</head>
<body data-page="login">
  <div id="site-lock" role="dialog" aria-modal="true" aria-labelledby="pin-hint">
    <div class="site-lock-inner">
      <img class="site-lock-logo" src="icons/favicon.svg" width="72" height="72" alt="PawsForward" />
      <p class="site-lock-hint" id="pin-hint">Use the PIN your manager gave you</p>
      <p id="status-banner" class="site-lock-error" hidden role="status"></p>
      <form id="pin-form" class="site-lock-form" autocomplete="off" novalidate>
        <label class="sr-only" for="pin-input">Your PIN</label>
        <input
          id="pin-input"
          class="site-lock-input"
          name="pin"
          type="password"
          inputmode="numeric"
          pattern="[0-9]*"
          maxlength="4"
          minlength="4"
          required
          autofocus
          placeholder="Your PIN"
          autocomplete="one-time-code"
          aria-describedby="pin-hint"
        />
      </form>
    </div>
    <div class="site-lock-legal">
      <a href="privacy.html" class="site-lock-legal-link">Privacy Policy</a>
      <span class="site-lock-legal-sep" aria-hidden="true">·</span>
      <a href="terms.html" class="site-lock-legal-link">Terms of Service</a>
      <span class="site-lock-legal-sep" aria-hidden="true">·</span>
      <a href="donate.html" class="site-lock-legal-link">Help</a>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/pin-lock.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
