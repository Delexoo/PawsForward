  <script>
    (function () {
      // Short QR links: /PawsForward/r/<referral_code> → donate checkout
      var match = location.pathname.match(/\/r\/([^\/?#]+)\/?$/);
      if (!match) return;
      var code = decodeURIComponent(match[1] || "").trim();
      if (!code) return;
      var base = location.pathname.replace(/\/r\/[^\/]+\/?$/, "/");
      location.replace(base + "donate.html?ref=" + encodeURIComponent(code));
    })();
  </script>
