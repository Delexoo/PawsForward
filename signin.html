<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Sign in to your Paws Forward dashboard with the email from your QR.">
  <title>Sign in · Paws Forward</title>
  <link rel="icon" href="icons/favicon.png?v=20261108z" type="image/png" sizes="64x64">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=20261108z" sizes="180x180">
  <link rel="manifest" href="manifest.webmanifest?v=20261108z">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/pf-site.css?v=20261111e">
  <link rel="stylesheet" href="css/pf-join.css?v=20261110d">
  <link rel="stylesheet" href="css/pf-account.css?v=20261111z">
  <script src="js/config.js?v=20261109n"></script>
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>
  <header class="topbar">
    <a class="logo" href="/">
      <img src="doc/brand-mark.png" width="24" height="24" alt="">
      Paws Forward
    </a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-menu">
      <span class="menu-label">Menu</span>
      <span class="menu-bars" aria-hidden="true"></span>
    </button>
    <nav class="menu-screen" id="site-menu" aria-label="Primary">
      <a href="/">Home</a>
      <a href="/join">Get your QR</a>
      <a href="/signin" aria-current="page">Sign in</a>
    </nav>
  </header>
  <main id="content" class="signin-main">
    <div class="signin-shell">
      <h1>Sign in</h1>
      <p class="signin-lead">Use the email from your QR. We’ll send a link and a code. No password.</p>
      <section class="join-panel">
        <div id="status-banner" class="status-banner" hidden role="status"></div>
        <form class="join-form" id="signin-form" action="#" method="post">
          <div class="field">
            <label for="signin-email">Email</label>
            <input id="signin-email" name="email" type="email" required autocomplete="email" maxlength="120" placeholder="you@email.com" inputmode="email">
            <p class="field-error" id="err-signin-email" hidden></p>
          </div>
          <div class="field" id="signin-code-wrap" hidden>
            <label for="signin-code">Code from the email</label>
            <input id="signin-code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="123456">
            <p class="field-error" id="err-signin-code" hidden></p>
          </div>
          <button type="submit" class="join-submit" id="signin-submit">Email me a sign-in link</button>
        </form>
      </section>
    </div>
  </main>
  <script src="js/pf-load.js?v=20261108aa" defer></script>
  <script src="js/vendor/supabase.js?v=20261108z" defer></script>
  <script src="js/promoter-session.js?v=20261111v" defer></script>
  <script src="js/signin.js?v=20261111v" defer></script>
</body>
</html>
