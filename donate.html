<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Paws Forward">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="Donate to PawsForward. Your gift is attributed to the employee whose QR you scanned.">
  <link rel="canonical" href="https://joinpawsforward.com/donate.html">
  <title>Donate · PawsForward</title>
  <link rel="icon" href="icons/favicon.png?v=20261106o" type="image/png" sizes="64x64">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=20261106o" sizes="180x180">
  <link rel="manifest" href="manifest.webmanifest?v=20261106o">
  <link rel="stylesheet" href="css/fonts.css?v=20261106o">
  <script src="js/theme.js?v=20261106o"></script>
  <link rel="stylesheet" href="css/site.css?v=20261106o">
  <link rel="stylesheet" href="css/paws.css?v=20261106o">
  <script src="js/config.js?v=20261106o"></script>
  <script src="js/canonical.js?v=20261106o"></script>
  <style>
    body[data-page="donate"] #page-body,
    body[data-page="donate"] #page-body * {
      visibility: visible !important;
    }
    body[data-page="donate"] #page-body {
      display: grid !important;
      pointer-events: auto !important;
      user-select: auto !important;
    }
  </style>
</head>
<body data-page="donate" data-public="1">
  <script>
    document.body.setAttribute("data-public", "1");
    document.body.classList.add("site-unlocked");
  </script>
  <a class="skip-link" href="#page-body">Skip to content</a>
  <div id="page-body" class="donate-shell">
    <div class="pf-donate-card" id="donate-card">
      <img class="pf-donate-logo" src="doc/brand-mark.png" width="56" height="56" alt="PawsForward">
      <h1 class="pf-donate-title">PawsForward</h1>
      <p class="pf-donate-lead" id="donate-lead">Taking you to Stripe Checkout…</p>
      <p class="pf-donate-attr" id="donate-attr" hidden></p>
      <div id="status-banner" class="status-banner" hidden role="status"></div>

      <div id="donate-form-panel">
        <p class="pf-donate-note" id="donate-note">Choose any amount on the secure Stripe page. This gift is tracked to the scanned employee QR.</p>
        <button type="button" class="btn pf-donate-submit" id="donate-retry" hidden>Try Stripe again</button>
        <p class="pf-donate-note" style="margin-top:14px">Want to help promote PawsForward? <a href="join.html">Create your own QR</a>.</p>
      </div>

      <div id="donate-success" class="pf-donate-success" hidden>
        <h2>Thank you</h2>
        <p id="donate-success-text">Your donation went through.</p>
      </div>
    </div>
  </div>

  <script src="js/vendor/supabase.js?v=20261106o"></script>
  <script src="js/supabase-client.js?v=20261106o"></script>
  <script src="js/donate.js?v=20261106o"></script>
</body>
</html>
