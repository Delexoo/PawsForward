<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff9f3">
  <meta name="description" content="Donate to Paws Forward — opens secure Stripe Checkout.">
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://joinpawsforward.com/donate.html">
  <title>Donate · Paws Forward</title>
  <link rel="icon" href="icons/favicon.png?v=20261107d" type="image/png" sizes="64x64">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=20261107d" sizes="180x180">
  <script>
    /* Instant Stripe — no interstitial. Only success/cancel return stays on this page. */
    (function () {
      var params = new URLSearchParams(location.search);
      if (params.get("success") === "1" && params.get("session_id")) return;
      if (params.get("cancelled") === "1") return;
      var u = new URL("https://tauiyhyjujddsgvlihef.supabase.co/functions/v1/create-checkout");
      var ref = String(params.get("ref") || "").trim();
      if (ref) u.searchParams.set("ref", ref);
      u.searchParams.set("site_origin", "https://joinpawsforward.com");
      location.replace(u.href);
    })();
  </script>
  <script src="js/config.js?v=20261107d"></script>
  <script src="js/canonical.js?v=20261107d"></script>
  <style>
    :root { --cream: #fff9f3; --ink: #2d312b; --green: #6b8361; --taupe: #ada496; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; min-height: 100%;
      background: var(--cream); color: var(--ink);
      font-family: "DM Sans", system-ui, sans-serif;
    }
    body { display: grid; place-items: center; min-height: 100dvh; padding: 24px; }
    .skip-link { position: absolute; left: -9999px; }
    .skip-link:focus { left: 12px; top: 12px; z-index: 2; background: #fff; padding: 8px 12px; }
    .pf-donate-panel { width: min(420px, 100%); text-align: center; }
    .pf-donate-panel[hidden] { display: none !important; }
    .pf-donate-panel h1 {
      margin: 0 0 12px;
      font-size: clamp(1.6rem, 4vw, 2rem);
      font-weight: 800;
      letter-spacing: -0.04em;
    }
    .pf-donate-panel p {
      margin: 0 0 22px;
      font-size: 1.05rem;
      font-weight: 550;
      line-height: 1.45;
    }
    .pf-donate-panel .muted { color: var(--taupe); font-weight: 500; }
    .pf-donate-home {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 48px; padding: 0 22px; border-radius: 12px;
      background: var(--green); color: #fff !important; font-weight: 700; text-decoration: none;
    }
    .pf-donate-retry {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 48px; padding: 0 22px; border-radius: 12px; margin-top: 8px;
      background: var(--ink); color: #fff !important; font-weight: 700; text-decoration: none;
    }
  </style>
</head>
<body data-page="donate" data-public="1">
  <a class="skip-link" href="#page-body">Skip to content</a>
  <div id="page-body">
    <div class="pf-donate-panel" id="donate-success" hidden>
      <h1>Thank you</h1>
      <p id="donate-success-text">Your donation went through. Thank you for supporting the rescue.</p>
      <a class="pf-donate-home" href="index.html">Back to Paws Forward</a>
    </div>
    <div class="pf-donate-panel" id="donate-cancelled" hidden>
      <h1>Checkout cancelled</h1>
      <p class="muted">No charge was made. You can donate whenever you’re ready.</p>
      <a class="pf-donate-retry" id="donate-retry" href="https://tauiyhyjujddsgvlihef.supabase.co/functions/v1/create-checkout?site_origin=https://joinpawsforward.com">Donate with Stripe</a>
      <p style="margin-top:18px"><a class="pf-donate-home" href="index.html">Back home</a></p>
    </div>
  </div>
  <script src="js/donate.js?v=20261107d"></script>
</body>
</html>
