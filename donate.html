<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff9f3">
  <meta name="description" content="Donate to Paws Forward — opens secure Stripe Checkout.">
  <link rel="canonical" href="https://joinpawsforward.com/donate.html">
  <title>Donate · Paws Forward</title>
  <link rel="icon" href="icons/favicon.png?v=20261106w" type="image/png" sizes="64x64">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=20261106w" sizes="180x180">
  <script src="js/config.js?v=20261106w"></script>
  <script src="js/canonical.js?v=20261106w"></script>
  <style>
    :root { --cream: #fff9f3; --ink: #2d312b; --taupe: #ada496; --green: #6b8361; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--cream); color: var(--ink);
      font-family: "DM Sans", system-ui, sans-serif; }
    body { display: grid; place-items: center; min-height: 100dvh; padding: 24px; }
    .skip-link { position: absolute; left: -9999px; }
    .skip-link:focus { left: 12px; top: 12px; z-index: 2; background: #fff; padding: 8px 12px; }
    .pf-donate-redirect, .pf-donate-done {
      width: min(420px, 100%);
      text-align: center;
    }
    .pf-donate-redirect[hidden], .pf-donate-done[hidden] { display: none !important; }
    .pf-donate-redirect p, .pf-donate-done p {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 550;
      line-height: 1.45;
      color: var(--taupe);
    }
    .pf-donate-done h1 {
      margin: 0 0 12px;
      font-size: clamp(1.6rem, 4vw, 2rem);
      font-weight: 800;
      letter-spacing: -0.04em;
    }
    .pf-donate-done p { color: var(--ink); margin-bottom: 22px; }
    .pf-donate-home {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 22px;
      border-radius: 12px;
      background: var(--green);
      color: #fff !important;
      font-weight: 700;
      text-decoration: none;
    }
    .pf-donate-spin {
      width: 36px;
      height: 36px;
      margin: 0 auto 16px;
      border: 3px solid #e5e0d8;
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .pf-donate-spin { animation: none; border-top-color: var(--green); }
    }
  </style>
</head>
<body data-page="donate" data-public="1">
  <a class="skip-link" href="#page-body">Skip to content</a>
  <div id="page-body">
    <div class="pf-donate-redirect" id="donate-redirect" role="status" aria-live="polite">
      <div class="pf-donate-spin" aria-hidden="true"></div>
      <p id="donate-lead">Opening Stripe Checkout…</p>
    </div>
    <div class="pf-donate-done" id="donate-success" hidden>
      <h1>Thank you</h1>
      <p id="donate-success-text">Your donation went through. Thank you for supporting the rescue.</p>
      <a class="pf-donate-home" href="index.html">Back to Paws Forward</a>
    </div>
  </div>
  <script src="js/donate.js?v=20261106w"></script>
</body>
</html>
