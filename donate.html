<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff9f3">
  <meta name="description" content="Donate to Paws Forward — opens secure Stripe Checkout.">
  <link rel="canonical" href="https://joinpawsforward.com/donate.html">
  <title>Donate · Paws Forward</title>
  <link rel="icon" href="icons/favicon.png?v=20261106x" type="image/png" sizes="64x64">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=20261106x" sizes="180x180">
  <script>
    /* Instant Stripe redirect — no interstitial. Success return keeps thank-you below. */
    (function () {
      var params = new URLSearchParams(location.search);
      if (params.get("success") === "1" && params.get("session_id")) return;
      var u = new URL("https://tauiyhyjujddsgvlihef.supabase.co/functions/v1/create-checkout");
      var ref = String(params.get("ref") || "").trim();
      if (ref) u.searchParams.set("ref", ref);
      u.searchParams.set("site_origin", "https://joinpawsforward.com");
      location.replace(u.href);
    })();
  </script>
  <script src="js/config.js?v=20261106x"></script>
  <script src="js/canonical.js?v=20261106x"></script>
  <style>
    :root { --cream: #fff9f3; --ink: #2d312b; --taupe: #ada496; --green: #6b8361; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--cream); color: var(--ink);
      font-family: "DM Sans", system-ui, sans-serif; }
    body { display: grid; place-items: center; min-height: 100dvh; padding: 24px; }
    .skip-link { position: absolute; left: -9999px; }
    .skip-link:focus { left: 12px; top: 12px; z-index: 2; background: #fff; padding: 8px 12px; }
    .pf-donate-done {
      width: min(420px, 100%);
      text-align: center;
    }
    .pf-donate-done[hidden] { display: none !important; }
    .pf-donate-done h1 {
      margin: 0 0 12px;
      font-size: clamp(1.6rem, 4vw, 2rem);
      font-weight: 800;
      letter-spacing: -0.04em;
    }
    .pf-donate-done p {
      margin: 0 0 22px;
      font-size: 1.05rem;
      font-weight: 550;
      line-height: 1.45;
      color: var(--ink);
    }
    .pf-donate-home {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 22px;
      border-radius: 12px;
      background: var(--green);
      color: #fff !important;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body data-page="donate" data-public="1">
  <a class="skip-link" href="#page-body">Skip to content</a>
  <div id="page-body">
    <div class="pf-donate-done" id="donate-success" hidden>
      <h1>Thank you</h1>
      <p id="donate-success-text">Your donation went through. Thank you for supporting the rescue.</p>
      <a class="pf-donate-home" href="index.html">Back to Paws Forward</a>
    </div>
  </div>
  <script src="js/donate.js?v=20261106x"></script>
</body>
</html>
